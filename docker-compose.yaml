services:
  # Step 1: DB
  db:
    image: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready", "-d", "postgres" ]
      interval: 10s
      timeout: 3s
      retries: 3
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Step 2: Migrator
  migrator:
    image: sug4chy/jit-dalshe-migrator
    environment:
      DOTNET_ENVIRONMENT: ${DOTNET_ENVIRONMENT}
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection}
    depends_on:
      db:
        condition: service_healthy

  # Step 3: News fetcher
  news-fetcher:
    image: sug4chy/jit-dalshe-new-fetcher
    environment:
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection}
      DOTNET_ENVIRONMENT: ${DOTNET_ENVIRONMENT}
      VK_API_ACCESS_TOKEN: ${VK_API_ACCESS_TOKEN}
    depends_on:
      migrator:
        condition: service_completed_successfully

  # Step 4: MinIO
  minio:
    image: minio/minio
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY]
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    command: "server --address 0.0.0.0:9000 /data"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      news_fetcher:
        condition: service_completed_successfully

  # Step 5: APIs
  site-api:
    image: sug4chy/jit-dalshe-site-api
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection}
      Minio__Endpoint: ${Minio__Endpoint}
      Minio__AccessKey: ${MINIO_ACCESS_KEY}
      Minio__SecretKey: ${MINIO_SECRET_KEY}
    healthcheck:
      test: [ "CMD-SHELL", "curl --fail http://localhost:8080/health || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      minio:
        condition: service_healthy

  admin-api:
    image: sug4chy/jit-dalshe-admin-api
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection}
      Minio__Endpoint: ${Minio__Endpoint}
      Minio__AccessKey: ${MINIO_ACCESS_KEY}
      Minio__SecretKey: ${MINIO_SECRET_KEY}
      CurrentURL: ${ADMIN_API_URL}
    healthcheck:
      test: [ "CMD-SHELL", "curl --fail http://localhost:8080/health || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      minio:
        condition: service_healthy

  vk-callback-api:
    image: sug4chy/jit-dalshe-vk-callback-api
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection}
    healthcheck:
      test: [ "CMD-SHELL", "curl --fail http://localhost:8080/health || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      minio:
        condition: service_healthy

  # Step 6: Admin UI
  admin-ui:
    image: sug4chy/jit-dalshe-admin-ui
    environment:
      Api__BaseUrl: ${ADMIN_API_URL}
    depends_on:
      admin-api:
        condition: service_healthy

  # Step 7: Nginx
  nginx:
    image: nginx
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certificates:/certificates
    depends_on:
      admin-ui:
        condition: service_started
      vk-callback-api:
        condition: service_healthy
      site-api:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
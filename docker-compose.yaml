services:
  # Step 1: DB
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 10s
      timeout: 3s
      retries: 3
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Step 2: Migrator
  migrator:
    image: soniccooles/jit-dalshe-migrator:latest
    environment:
      DOTNET_ENVIRONMENT: ${DOTNET_ENVIRONMENT}
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection}
      AdminCredentials__Email: ${ADMIN_EMAIL}
      AdminCredentials__Password: ${ADMIN_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  # Step 3: News fetcher
  news-fetcher:
    image: soniccooles/jit-dalshe-news-fetcher
    environment:
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection}
      DOTNET_ENVIRONMENT: ${DOTNET_ENVIRONMENT}
      VK_API_ACCESS_TOKEN: ${VK_API_ACCESS_TOKEN}
    depends_on:
      migrator:
        condition: service_completed_successfully

  # Step 4: MinIO
  minio:
    image: minio/minio
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    command: "server --address 0.0.0.0:9000 --console-address 0.0.0.0:9001 /data"
    ports:
      - "${MINIO_ADDRESS:-127.0.0.1}:9000:9000"
      - "${MINIO_ADDRESS:-127.0.0.1}:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      news-fetcher:
        condition: service_completed_successfully

  # Step 5: APIs
  api-site:
    image: soniccooles/jit-dalshe-api-site:latest
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection}
      Minio__Endpoint: ${Minio__Endpoint}
      Minio__AccessKey: ${MINIO_ACCESS_KEY}
      Minio__SecretKey: ${MINIO_SECRET_KEY}
      
      Email__SmtpServer: ${SMTP_SERVER}
      Email__Port: ${SMTP_PORT}
      Email__SenderEmail: ${SMTP_SENDER}
      Email__RecipientEmail: ${SMTP_RECIPIENT}
      Email__Username: ${SMTP_USERNAME}
      Email__Password: ${SMTP_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/health || wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      minio:
        condition: service_healthy
      db:
        condition: service_healthy

  api-admin:
    image: soniccooles/jit-dalshe-api-admin:latest
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection}
      Minio__Endpoint: ${Minio__Endpoint}
      Minio__AccessKey: ${MINIO_ACCESS_KEY}
      Minio__SecretKey: ${MINIO_SECRET_KEY}
      AdminCredentials__Email: ${ADMIN_EMAIL}
      AdminCredentials__Password: ${ADMIN_PASSWORD}
      Jwt__Key: ${JWT_SECRET_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      minio:
        condition: service_healthy
      db:
        condition: service_healthy

  api-vk-callback:
    image: soniccooles/jit-dalshe-api-vk-callback
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Step 6: Admin UI
  admin-ui:
    image: soniccooles/jit-dalshe-admin-ui:latest
    depends_on:
      api-admin:
        condition: service_started

  # Step 6: Client UI
  client-ui:
    image: soniccooles/jit-dalshe-client-ui:latest
    restart: always
  
  
  # Step 8: Nginx
  nginx:
    image: nginx
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certificates:/certificates
    ports:
      - "8080:80"
    depends_on:
      client-ui:
        condition: service_started
      admin-ui:
        condition: service_started
      api-vk-callback:
        condition: service_healthy
      api-site:
        condition: service_healthy
      api-admin:
        condition: service_healthy
        
volumes:
  postgres_data:
  minio_data:
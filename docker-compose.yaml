services:
  # Step 1: DB
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 10s
      timeout: 3s
      retries: 3
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Step 2: Migrator
  migrator:
    build:
      context: .
      dockerfile: JitDalshe.Migrator/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: ${DOTNET_ENVIRONMENT}
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection}
    depends_on:
      db:
        condition: service_healthy

#  # Step 3: News fetcher
#  news-fetcher:
#    image: soniccooles/jit-dalshe-news-fetcher
#    environment:
#      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection}
#      DOTNET_ENVIRONMENT: ${DOTNET_ENVIRONMENT}
#      VK_API_ACCESS_TOKEN: ${VK_API_ACCESS_TOKEN}
#    depends_on:
#      migrator:
#        condition: service_completed_successfully

  # Step 4: MinIO
  minio:
    image: minio/minio
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    command: "server --address 0.0.0.0:9000 --console-address 0.0.0.0:9001 /data"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 10s
      timeout: 3s
      retries: 3
#    depends_on:
#      news-fetcher:
#        condition: service_completed_successfully

  # Step 5: APIs
  api-site:
    build:
      context: .
      dockerfile: JitDalshe.Api.Site/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection}
      Minio__Endpoint: ${Minio__Endpoint}
      Minio__AccessKey: ${MINIO_ACCESS_KEY}
      Minio__SecretKey: ${MINIO_SECRET_KEY}
#    healthcheck:
#      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"]
#      interval: 10s
#      timeout: 3s
#      retries: 3
    depends_on:
      minio:
        condition: service_healthy

  api-admin:
    build:
      context: .
      dockerfile: JitDalshe.Api.Admin/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection}
      Minio__Endpoint: ${Minio__Endpoint}
      Minio__AccessKey: ${MINIO_ACCESS_KEY}
      Minio__SecretKey: ${MINIO_SECRET_KEY}
#    healthcheck:
#      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"]
#      interval: 10s
#      timeout: 3s
#      retries: 3
    depends_on:
      minio:
        condition: service_healthy

  api-vk-callback:
    image: soniccooles/jit-dalshe-api-vk-callback
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection}
#    healthcheck:
#      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"]
#      interval: 10s
#      timeout: 3s
#      retries: 3
    depends_on:
      minio:
        condition: service_healthy

  # Step 6: Admin UI
  admin-ui:
    build:
      context: .
      dockerfile: JitDalshe.Ui.Admin/Dockerfile
    depends_on:
      api-admin:
        condition: service_started

  # Step 6: Client UI
  client-ui:
    build:
      context: ./oncology_web
      dockerfile: Dockerfile
    restart: always
  
  
  # Step 8: Nginx
  nginx:
    image: nginx
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certificates:/certificates
      - ./.htpasswd:/etc/nginx/.htpasswd
    ports:
      - "8080:80"
    depends_on:
      admin-ui:
        condition: service_started
      api-vk-callback:
        condition: service_started
      api-site:
        condition: service_started
      client-ui:
        condition: service_started
        
volumes:
  postgres_data:
  minio_data:
server {
    listen 80;
    server_name localhost;

    add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive" always;
    
    auth_basic "Restricted: dev only";
    auth_basic_user_file /etc/nginx/.htpasswd;
    
    
    
    location /admin {
        proxy_pass http://admin-ui:80/;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    
    location /api/site/ {
        proxy_pass http://api-site:8080/api-site/v1/;
        
        proxy_set_header Host $host;
    }
    
    location /api/vk-callback/v1/events {
        proxy_pass http://api-vk-callback:8080/api-vk-callback/v1/events;
        
        proxy_set_header Host $host;
    }
    
    location /api/admin/ {
        proxy_pass http://api-admin:8080/api-admin/v1/;
        
        proxy_set_header Host $host;
    }
    
    location / {
        proxy_pass http://client-ui:3000/;
        
        proxy_set_header Host $host;
    }
    
    location /api/v1/banners/displaying {
        proxy_pass http://api-site:8080/api-site/v1/banners;
        proxy_set_header Host $host;
    }
    
    location /api/v1/ {
        proxy_pass http://api-site:8080/api-site/v1/;
        proxy_set_header Host $host;
    }
}
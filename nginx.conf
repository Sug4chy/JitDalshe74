server {
    listen 80;
    server_name localhost;

    location /admin {
        proxy_pass http://admin-ui:80/;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    
    location /api/site/ {
        proxy_pass http://api-site:8080/api-site/v1/;
        
        proxy_set_header Host $host;
    }
    
    location /api/vk-callback/v1/events {
        proxy_pass http://api-vk-callback:8080/api-vk-callback/v1/events;
        
        proxy_set_header Host $host;
    }
    
    location /api/admin/ {
        proxy_pass http://api-admin:8080/api-admin/v1/;
        
        proxy_set_header Host $host;
    }
    
    location / {
        proxy_pass http://api-site:8080/;
        
        proxy_set_header Host $host;
    }
}
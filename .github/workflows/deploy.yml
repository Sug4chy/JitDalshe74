name: CI/CD pipeline test deploy

on:
  push:
    branches:
      - feature/ci-cd

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push api-site image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: JitDalshe.Api.Site/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/jit-dalshe-api-site:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/jit-dalshe-api-site:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/jit-dalshe-api-site:buildcache,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy to dev server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/soniccooles/projects/JitDalshe74
            
            git fetch origin
            git checkout feature/ci-cd
            git pull origin feature/ci-cd
            
            echo "${{ secrets.DOCKER_HUB_TOKEN }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin
            
            docker compose pull api-site
            docker compose up -d api-site
            
            docker image prune -f